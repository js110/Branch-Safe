name: BSP artifact verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-lock.txt
      - name: Validate frozen evidence source SHA and paths
        run: python scripts/verify_export.py
      - name: Run self-contained tests (external-data tests explicitly skipped)
        run: python -m unittest discover -s tests -v
